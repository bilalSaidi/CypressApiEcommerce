name: Cypress API Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Cypress config
        run: |
          cat > cypress.config.js << EOF
          const { defineConfig } = require("cypress");
          
          module.exports = defineConfig({
            env: {
              AdminEmail: "admin@practicesoftwaretesting.com",
              AdminPassword: "welcome01"
            },
            e2e: {
              baseUrl: "https://api-with-bugs.practicesoftwaretesting.com",
              setupNodeEvents(on, config) {
                // implement node event listeners here
              },
            },
          });
          EOF

      - name: Debug environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Cypress version: $(npx cypress version)"
          ls -la
          cat cypress.config.js

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          record: false
          config: baseUrl=https://api-with-bugs.practicesoftwaretesting.com
        env:
          CYPRESS_AdminEmail: admin@practicesoftwaretesting.com
          CYPRESS_AdminPassword: welcome01

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.node-version }}-chrome
          path: cypress/screenshots
          retention-days: 7

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.node-version }}-chrome
          path: cypress/videos
          retention-days: 7
